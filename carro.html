<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito | Noble Aroma</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/logo/logo-cafe.png" type="image/png" />
</head>

<body>
 <div id="header-placeholder"></div>
  <main class="pagina-carrito"
    style="min-height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center;">
    <p class="titulo-etiqueta">TU PEDIDO</p>
    <h1 style="font-family: 'Playfair Display', serif; color: #173D2D; font-size: 48px; margin: 10px 0;">Carrito de
      Compras</h1>
    <p style="color: #6B4632; margin-bottom: 30px;">Haz clic en el icono del carrito (arriba a la derecha) para ver tus
      productos.</p>
    <button class="boton-leer-mas" id="btn-abrir-carrito-centro">Abrir Carrito</button>
  </main>

 <div id="footer-placeholder"></div>

  <div id="overlay-carrito" class="overlay-carrito"></div>
  <aside id="panel-carrito" class="panel-carrito">
    <div class="panel-header">
      <h2>Tu Carrito</h2>
      <button class="cerrar-panel" id="cerrar-panel">&times;</button>
    </div>
    <div class="panel-body">
      <div id="lista-carrito" class="lista-carrito"></div>
      <div id="carrito-vacio" class="carrito-vacio" hidden>
        <p>Tu carrito está vacío.</p>
        <a href="productos.html" class="boton-leer-mas">Ver Productos</a>
      </div>
    </div>
    <div class="panel-footer" id="resumen-carrito" hidden>
      <div class="linea-resumen"><span>Subtotal</span><span id="subtotal">$0</span></div>
      <div class="linea-resumen"><span>Envío</span><span>Gratis</span></div>
      <div class="linea-resumen total"><span>Total</span><span id="total-final">$0</span></div>
      <button id="btn-pagar" class="boton-confirmar">Proceder al Pago</button>
      <button id="btn-vaciar" class="boton-vaciar">Vaciar carrito</button>
    </div>
  </aside>
  <div id="modal-checkout" class="modal-overlay">
    <div class="modal-contenido">
      <button class="modal-cerrar" id="cerrar-checkout">&times;</button>
      <h2 style="font-family: 'Playfair Display', serif; color: #173D2D; margin-top: 0;">Finalizar Compra</h2>
      <form id="form-checkout" class="modal-formulario">
        <label>Nombre completo</label>
        <input type="text" id="checkout-nombre" placeholder="Tu nombre" required>
        <label>Dirección de entrega</label>
        <input type="text" id="checkout-direccion" placeholder="Ej. Cra 24 #18-11" required>
        <label>Teléfono de contacto</label>
        <input type="tel" id="checkout-telefono" placeholder="Ej. 300 123 4567" required>
        <label>Método de Pago</label>
        <div class="opciones-pedido">
          <label class="opcion-radio"><input type="radio" name="metodo-pago" value="Tarjeta de Crédito/Débito" checked>
            Tarjeta de Crédito/Débito</label>
          <label class="opcion-radio"><input type="radio" name="metodo-pago" value="Pago en Efectivo"> Pago en Efectivo
            (Contra entrega)</label>
          <label class="opcion-radio"><input type="radio" name="metodo-pago" value="Transferencia Bancaria">
            Transferencia Bancaria</label>
        </div>
        <button type="submit" class="boton-confirmar">Confirmar y Pagar</button>
      </form>
    </div>
  </div>
  <script src="../js/principal.js"></script>
  <script src="../js/carrito.js"></script>
</body>

</html>
